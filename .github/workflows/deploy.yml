# 代理表同步流水线
#
# 架构（与 Cloudflare Pages 的 GitHub 集成配合）：
#
#   push 到 main
#     ├─ Cloudflare Pages 自动构建并部署站点（面板显示「已启用」）
#     └─ 本流水线：build → sync-kv，把代理表写入 KV
#
# 为什么分开：站点的部署与 KV 的更新必须来自同一次构建，否则会出现
# 「站点已含新版本、KV 还是旧表」的错位，表现为新版本下载链接 404。
#
# 这里 build 产出的代理表副本只用于同步 KV，不用于部署；
# 站点由 CF 集成构建部署，两条路径互不干扰，也不存在竞态。
#
# KV 里的代理表是权威数据源，Worker 优先读 KV（按分片懒加载），
# 构建期内联的静态表仅作兜底。因此后续新增 release 时，
# 代理表更新只需重跑本流水线，不必重新部署站点 ——
# 重新部署会清空边缘缓存，导致下载速度骤降。

name: Sync proxy table to KV
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager and project dir
        id: detect
        run: |
          if [ -f "package.json" ]; then
            ROOT="."
          elif [ -f "frontend/package.json" ]; then
            ROOT="frontend"
          elif [ -f "app/package.json" ]; then
            ROOT="app"
          elif [ -f "web/package.json" ]; then
            ROOT="web"
          else
            ROOT=$(find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1 | xargs -r dirname)
            [ -z "$ROOT" ] && ROOT="."
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT

          if [ -f "$ROOT/pnpm-lock.yaml" ]; then
            PM="pnpm"; LOCK="$ROOT/pnpm-lock.yaml"
          elif [ -f "$ROOT/yarn.lock" ]; then
            PM="yarn"; LOCK="$ROOT/yarn.lock"
          elif [ -f "$ROOT/package-lock.json" ]; then
            PM="npm"; LOCK="$ROOT/package-lock.json"
          elif [ -f "$ROOT/package.json" ]; then
            PM="npm"; LOCK=""   # 有 package.json 但无锁文件
          else
            PM="none"; LOCK=""
          fi
          echo "pm=$PM" >> $GITHUB_OUTPUT
          echo "lock=$LOCK" >> $GITHUB_OUTPUT
          echo "Detected: root=$ROOT, pm=$PM, lock=$LOCK"
      - name: Setup pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node (with cache)
        if: steps.detect.outputs.lock != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: '${{ steps.detect.outputs.pm }}'
          cache-dependency-path: '${{ steps.detect.outputs.lock }}'
      - name: Setup Node (no cache)
        if: steps.detect.outputs.lock == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: '${{ steps.detect.outputs.root }}'
        run: |
          case "${{ steps.detect.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile || pnpm install ;;
            yarn) yarn install --frozen-lockfile || yarn install ;;
            npm)
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              ;;
            *)
              echo "No package.json found, skip install";;
          esac
      - name: Build
        id: build
        working-directory: '${{ steps.detect.outputs.root }}'
        env:
          githubToken: '${{ secrets.githubToken }}'
        run: >
          if [ ! -f package.json ]; then
            echo "No build step, using root as output"
            echo "output=${{ steps.detect.outputs.root }}" >> $GITHUB_OUTPUT
            exit 0
          fi


          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)"; then
            npm run build
          elif node -e "const s=require('./package.json').scripts||{}; process.exit(s.docs:build?0:1)"; then
            npm run docs:build
          else
            echo "No build script found"; exit 1
          fi


          # 按优先级探测构建输出目录

          # 注意：本项目使用 VuePress 2，输出目录为 .vuepress/dist

          for d in .vuepress/dist dist out build public _site docs/.vuepress/dist docs/.vitepress/dist .vitepress/dist;
          do
            if [ -d "$d" ]; then
              echo "output=${{ steps.detect.outputs.root }}/$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "output=${{ steps.detect.outputs.root }}" >> $GITHUB_OUTPUT
      - name: Upload proxy table
        uses: actions/upload-artifact@v4
        with:
          name: proxy-table
          path: .vuepress/proxy-table.json
          if-no-files-found: ignore
  sync-kv:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download proxy table
        uses: actions/download-artifact@v4
        with:
          name: proxy-table
          path: .vuepress
      - name: Sync proxy table to KV
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          GITHUB_TOKEN: '${{ secrets.githubToken }}'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过代理表同步"
            exit 0
          fi
          # Cloudflare API 偶发 503，重试若干次。
          for attempt in 1 2 3 4 5; do
            echo "同步尝试 $attempt/5"
            if node scripts/sync-proxy-table.mjs; then
              exit 0
            fi
            echo "第 $attempt 次同步失败，等待后重试"
            sleep $((attempt * 10))
          done
          echo "代理表同步重试耗尽"
          exit 1
